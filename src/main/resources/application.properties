spring.application.name=agrimate-backend
server.port=8080

spring.config.import=optional:file:secrets/cloudinary.properties,optional:file:secrets/brevo.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrimate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

agrimate.jwt.secret=8fK3mP7xQ2vL9nR4sT6wY1aB5cD8eF0gH3jK6mN9pQ2rS5uV8xZ1
agrimate.jwt.access-ttl-minutes=15
agrimate.jwt.refresh-ttl-days=7

agrimate.auth.cookie-secure=false
agrimate.auth.cookie-same-site=Lax

agrimate.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}

agrimate.scan.low-confidence-threshold=0.6

agrimate.cors.allowed-origins=*

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
agrimate.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}
agrimate.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

agrimate.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:secrets/firebase-service-account.json}

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
agrimate.mail.from=${MAIL_FROM:agrimate4@gmail.com}
agrimate.otp.ttl-minutes=10
agrimate.otp.resend-cooldown-seconds=15
